name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate researcher folder + agent surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Required files exist
        run: |
          set -euo pipefail
          required=(
            README.md
            llms.txt
            identity.md
            rules.md
            examples.md
            .mcp.json
            tools/achiote_cli.py
            tools/achiote_mcp.py
            skills/achiote-food-memory-researcher/SKILL.md
            skills/achiote-food-memory-researcher/agents/openai.yaml
            reference/workflow.md
            reference/evidence-ledger.md
            reference/source-quality-ladder.md
            reference/source-list.md
            reference/dish-family-thinking.md
            reference/sensory-mechanisms.md
            reference/local-access-playbook.md
            reference/language-switching.md
            reference/quality-gates.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then echo "::error file=$f::missing required file"; missing=1; fi
          done
          [ "$missing" -eq 0 ] && echo "All required files present."

      - name: Python agent tools parse
        run: |
          set -euo pipefail
          python3 -m py_compile tools/achiote_cli.py tools/achiote_mcp.py

      - name: CLI smoke
        run: |
          set -euo pipefail
          python3 tools/achiote_cli.py intake \
            --fragment "something like pass-teh-lay, savory, wrapped" \
            --location Orlando \
            --format json | grep -q "minimum_viable_cue"
          python3 tools/achiote_mcp.py --self-test | grep -q "achiote_intake"

      - name: Skill metadata sanity
        run: |
          set -euo pipefail
          grep -q "^name: achiote-food-memory-researcher" skills/achiote-food-memory-researcher/SKILL.md
          grep -q 'display_name: "Achiote"' skills/achiote-food-memory-researcher/agents/openai.yaml

      - name: No leaked secrets
        run: |
          set -euo pipefail
          # Block obvious key shapes from ever entering the static site.
          if grep -rnE "sk-[A-Za-z0-9]{16,}|GLM_API_KEY|ANTHROPIC_API_KEY|x-api-key:\s*[A-Za-z0-9]{8,}" \
               --include=*.html --include=*.css --include=*.js --include=*.md .; then
            echo "::error::Possible secret committed to the static site"
            exit 1
          fi
          echo "No secret-shaped strings found."

      - name: No-process-leak guard (planning-only references stay out of shipped artifacts)
        run: |
          set -euo pipefail
          if grep -rniE "ratatouille|anton ego" \
               --include=*.html --include=*.css --include=*.js --include=*.md .; then
            echo "::error::Planning-only reference leaked into a shipped artifact"
            exit 1
          fi
          echo "No process leak."
